name: Render CV and Résumé PDFs
# _data/cv.yml이 바뀌면 bin/build_cv.py로 assets/pdf/CV.pdf와 Resume.pdf를 다시 만들고,
# 새 PDF가 사이트에 반영되도록 배포를 한 번 더 실행한다.
on:
  push:
    branches:
      - main
      - master
    paths:
      - "_data/cv.yml"
      - "bin/build_cv.py"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  rendercv:
    name: RenderCV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install RenderCV
        run: pip install "rendercv[full]" pyyaml
      - name: Build PDFs
        run: python bin/build_cv.py
      - name: Commit the PDFs
        id: commit
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add assets/pdf/CV.pdf assets/pdf/Resume.pdf
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: render the latest CV and Résumé"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Redeploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
